<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Transcript Fetcher</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #dbe3ef;
      --error: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(23, 32, 51, 0.08);
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .intro { margin: 0 0 28px; color: var(--muted); }

    form { display: grid; gap: 18px; }
    label { display: grid; gap: 8px; font-weight: 600; }

    input, select, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
    }

    input, select {
      min-height: 44px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      border-color: var(--primary);
    }

    button {
      min-height: 46px;
      margin-top: 4px;
      border: 0;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: var(--primary-dark); }
    button:disabled { cursor: wait; opacity: 0.7; }

    .result-label { margin-top: 26px; }
    textarea {
      min-height: 220px;
      padding: 12px;
      resize: vertical;
      color: var(--text);
      background: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status { min-height: 1.25em; margin-top: 10px; color: var(--muted); }
    .status.error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>YouTube Transcript Fetcher</h1>
    <p class="intro">Enter your Transcript API details to retrieve a transcript.</p>

    <form id="transcript-form">
      <label>
        API Key
        <input id="api-key" name="apiKey" type="password" autocomplete="off" required>
      </label>

      <label>
        YouTube Video URL
        <input id="video-url" name="videoUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." required>
      </label>

      <label>
        Format
        <select id="format" name="format">
          <option value="json">JSON</option>
          <option value="text">Text</option>
        </select>
      </label>

      <label>
        Include Timestamp
        <select id="include-timestamp" name="includeTimestamp">
          <option value="true">True</option>
          <option value="false">False</option>
        </select>
      </label>

      <button id="submit-button" type="submit">Fetch Transcript</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <label class="result-label" for="result">Response</label>
    <textarea id="result" readonly placeholder="The transcript response will appear here."></textarea>
  </main>

  <script>
    const form = document.getElementById('transcript-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Loading transcript...';
      result.value = '';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/get-transcript', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'The request failed.');
        }

        result.value = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        status.textContent = 'Transcript loaded.';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
        result.value = error.stack || error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
